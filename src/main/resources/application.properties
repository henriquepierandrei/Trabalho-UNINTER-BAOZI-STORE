spring.application.name=baozi-store
server.port=8080

# ===== Banco de dados padrão: H2 (arquivo local, não precisa instalar nada) =====
spring.datasource.url=jdbc:h2:file:./data/baozidb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/baozidb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para usar MySQL, rode com: --spring.profiles.active=mysql
